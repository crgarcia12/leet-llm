name: Optional Windows CUDA curriculum

on:
  workflow_dispatch:

jobs:
  windows-cuda:
    if: ${{ vars.ENABLE_WINDOWS_CUDA_CI == 'true' }}
    runs-on: [self-hosted, Windows, X64, NVIDIA-CUDA]
    steps:
      - uses: actions/checkout@v4
      - name: Configure CUDA 12.x
        shell: pwsh
        run: cmake --preset windows-cuda-debug
      - name: Build all lessons
        shell: pwsh
        run: cmake --build --preset windows-cuda-debug
      - name: Run CUDA tests
        shell: pwsh
        run: ctest --preset windows-cuda-debug
      - name: Validation report
        shell: pwsh
        run: scripts\validate-windows.ps1 -Cuda -Output build\reports\windows-nvidia-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-nvidia-validation
          path: build/reports/windows-nvidia-validation.json

